name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify (build, verify:build, typecheck, typecheck:native, verify:native)
        run: npm run verify
      - name: Audit (high+)
        run: npm audit --audit-level=high
